<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sanwitch Connect App" />
  <title>Sanwitch Connect - Standalone IoT PWA</title>
  
  <!-- PWA MANIFEST -->
  <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Sanwitch%20Connect%20App%22%2C%22short_name%22%3A%22SanwitchApp%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0d12%22%2C%22theme_color%22%3A%22%2338bdf8%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F2583%2F2583271.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0b0d12; color: #eef2ff; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    header { background: #16181f; padding: 14px 20px; border-bottom: 1px solid #2b3240; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 16px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .status-pill { background: rgba(20,184,166,0.15); border: 1px solid rgba(20,184,166,0.4); color: #14b8a6; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    nav { display: flex; background: #16181f; border-bottom: 1px solid #2b3240; }
    .nav-btn { flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 700; color: #97a0b5; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; }
    .nav-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56,189,248,0.05); }
    main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: #16181f; border: 1px solid #2b3240; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; }
    .card-title { font-size: 11px; font-weight: 700; color: #97a0b5; text-transform: uppercase; margin-bottom: 8px; }
    .toggle-box { display: flex; justify-content: space-between; align-items: center; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-round { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .3s; border-radius: 24px; }
    .slider-round:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider-round { background-color: #38bdf8; }
    input:checked + .slider-round:before { transform: translateX(20px); }
    .btn-action { background: #38bdf8; color: #0b0d12; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; width: 100%; }
    .btn-action:active { opacity: 0.8; }
    .link-card { background: #16181f; border: 1px solid #2b3240; border-radius: 16px; padding: 18px; }
    .input-field { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #2b3240; color: #fff; padding: 10px 14px; border-radius: 10px; margin: 8px 0 16px; font-size: 14px; }
    .term-box { background: #000; border: 1px solid #2b3240; border-radius: 14px; padding: 12px; height: 350px; overflow-y: auto; font-family: monospace; font-size: 11px; }
    .term-line { margin-bottom: 4px; }
    footer { text-align: center; padding: 16px; font-size: 11px; color: #97a0b5; border-top: 1px solid #2b3240; }
    .pwa-install-banner { position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 560px; margin: 0 auto; background: rgba(22, 24, 31, 0.95); border: 1.5px solid rgba(56, 189, 248, 0.5); padding: 14px 18px; border-radius: 16px; display: none; justify-content: space-between; align-items: center; backdrop-filter: blur(12px); box-shadow: 0 10px 25px rgba(0,0,0,0.6); z-index: 9999; }
    .pwa-install-btn { background: #38bdf8; color: #0b0d12; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ Sanwitch Connect PWA</div>
    <div class="status-pill" id="connStatus">● LINK READY</div>
  </header>
  <nav>
    <div class="nav-btn active" onclick="switchTab('panel', event)">PANEL</div>
    <div class="nav-btn" onclick="switchTab('link', event)">LINK</div>
    <div class="nav-btn" onclick="switchTab('term', event)">TERMINAL</div>
  </nav>
  <main>
    <div id="tab-panel" class="tab-content active">
      <div class="grid" id="widgetContainer">
        <div class="card">
          <div class="card-title">Power Relay</div>
          <div class="toggle-box">
            <span style="font-size:12px; color:#97a0b5;">STATUS</span>
            <label class="switch">
              <input type="checkbox" onchange="sendCmd('POWER:' + (this.checked?1:0))">
              <span class="slider-round"></span>
            </label>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Trigger Action</div>
          <button class="btn-action" onclick="sendCmd('ACTION:PUSH')">EXECUTE</button>
        </div>
      </div>
    </div>
    <div id="tab-link" class="tab-content">
      <div class="link-card">
        <h3 style="font-size:14px; color:#38bdf8; margin-bottom:12px;">WIFI HARDWARE TARGET</h3>
        <label style="font-size:11px; color:#97a0b5;">TARGET IP ADDRESS</label>
        <input type="text" id="targetIp" class="input-field" value="192.168.4.1">
        <button class="btn-action" onclick="saveLinkConfig()">CONNECT TARGET</button>
      </div>
    </div>
    <div id="tab-term" class="tab-content">
      <div class="term-box" id="termLog">
        <div class="term-line" style="color:#97a0b5;">[SYSTEM] Sanwitch Connect Standalone Engine Ready</div>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <input type="text" id="manualCmdInput" class="input-field" style="margin:0;" placeholder="e.g. POWER:1 or AT+STATUS">
        <button class="btn-action" style="width:100px;" onclick="sendManualCmd()">SEND</button>
      </div>
    </div>
  </main>

  <div class="pwa-install-banner" id="pwaBanner">
    <div>
      <div style="font-weight:800; font-size:13px; color:#fff;">📱 Install App on Phone</div>
      <div style="font-size:11px; color:#97a0b5;">Add to Mobile Home Screen (No Browser Bar)</div>
    </div>
    <button class="pwa-install-btn" onclick="installPwaApp()">INSTALL</button>
  </div>

  <footer>Hosted automatically via GitHub Pages - Sanwitch Connect App Engine</footer>

  <script>
    let targetIp = "192.168.4.1";
    const termLog = document.getElementById('termLog');

    function logTerm(msg, type='TX') {
      const line = document.createElement('div');
      line.className = 'term-line';
      line.style.color = type === 'TX' ? '#38bdf8' : (type === 'RX' ? '#14b8a6' : '#ef4444');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] [' + type + '] ' + msg;
      termLog.appendChild(line);
      termLog.scrollTop = termLog.scrollHeight;
    }

    function sendCmd(cmd) {
      logTerm(cmd, 'TX');
      fetch('http://' + targetIp + '/control?cmd=' + encodeURIComponent(cmd), { mode: 'no-cors' })
        .then(() => logTerm('OK: ' + cmd, 'RX'))
        .catch(e => logTerm('ERR: ' + e.message, 'ERR'));
    }

    function sendManualCmd() {
      const val = document.getElementById('manualCmdInput').value.trim();
      if (val) {
        sendCmd(val);
        document.getElementById('manualCmdInput').value = '';
      }
    }

    function saveLinkConfig() {
      targetIp = document.getElementById('targetIp').value;
      logTerm('Target IP updated to ' + targetIp, 'SYS');
      alert('Target IP Saved: ' + targetIp);
    }

    function switchTab(tab, evt) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      evt.target.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    }

    // PWA INSTALLATION PROMPT HANDLER
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwaBanner');
      if (banner) banner.style.display = 'flex';
    });

    function installPwaApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the PWA install prompt');
          }
          deferredPrompt = null;
          document.getElementById('pwaBanner').style.display = 'none';
        });
      }
    }
  </script>
</body>
</html>
